name: Esketamine Daily Report

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Target date (YYYY-MM-DD), leave empty for today"
        required: false
        default: ""

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('scripts/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Determine date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "target=${{ github.event.inputs.date }}" >> $GITHUB_OUTPUT
          else
            TARGET=$(TZ=Asia/Taipei date +%Y-%m-%d)
            echo "target=$TARGET" >> $GITHUB_OUTPUT
          fi
          echo "Date: $(cat $GITHUB_OUTPUT | grep target | cut -d= -f2)"

      - name: Fetch papers from PubMed
        run: |
          python scripts/fetch_papers.py \
            --days 7 \
            --max-papers 50 \
            --json \
            --output papers.json
        continue-on-error: true

      - name: Check papers data
        id: papers
        run: |
          if [ -f papers.json ] && grep -q '"count"' papers.json; then
            COUNT=$(python -c "import json; print(json.load(open('papers.json')).get('count',0))")
            echo "count=$COUNT" >> $GITHUB_OUTPUT
            echo "Papers found: $COUNT"
          else
            echo "count=0" >> $GITHUB_OUTPUT
            echo '{"date":"${{ steps.date.outputs.target }}","count":0,"papers":[]}' > papers.json
            echo "No papers found, will generate empty report"
          fi

      - name: Configure NVIDIA Nemotron backend
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('scripts/generate_report.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('https://open.bigmodel.cn/api/coding/paas/v4', 'https://integrate.api.nvidia.com/v1')
          for old, new in [
              ('GLM-5-Turbo', 'nvidia/nemotron-3-super-120b-a12b'),
              ('GLM-4.7-Flash', 'nvidia/nemotron-3-nano-30b-a3b'),
              ('GLM-4.7', 'nvidia/nemotron-3-nano-30b-a3b'),
          ]:
              s = s.replace(old, new)
          s = re.sub(r'MAX_TOKENS\s*=\s*[0-9_]+', 'MAX_TOKENS = 16384', s)
          s = s.replace('"temperature": 0.3', '"temperature": 1.0')
          s = s.replace('"top_p": 0.9', '"top_p": 0.95')
          marker = '"max_tokens": MAX_TOKENS,'
          if marker in s and 'chat_template_kwargs' not in s:
              s = s.replace(marker, marker + '\n        "chat_template_kwargs": {"enable_thinking": False},', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Generate report with NVIDIA Nemotron
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          test -n "$NVIDIA_API_KEY" || { echo "::error::Missing NVIDIA_API_KEY repository secret"; exit 1; }
          python scripts/generate_report.py \
            --input papers.json \
            --output docs/esketamine-${{ steps.date.outputs.target }}.html \
            --api-key "$NVIDIA_API_KEY"

      - name: Generate index page
        run: python scripts/generate_index.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "📄 Esketamine daily report: ${{ steps.date.outputs.target }}"
          git pull --rebase origin main
          git push

      - name: Summary
        run: |
          echo "### 📄 Esketamine Daily Report" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** ${{ steps.date.outputs.target }}" >> $GITHUB_STEP_SUMMARY
          echo "**Papers analyzed:** ${{ steps.papers.outputs.count }}" >> $GITHUB_STEP_SUMMARY
          echo "**Report:** [esketamine-${{ steps.date.outputs.target }}.html](https://u8901006.github.io/esketamine-brain/esketamine-${{ steps.date.outputs.target }}.html)" >> "$GITHUB_STEP_SUMMARY"
